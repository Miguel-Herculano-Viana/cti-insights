spring.application.name=cti-insights-api
# Lê o backend/.env (se existir). Valores depois de ":" são o padrão.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Banco (Neon) ----
# Formato JDBC: jdbc:postgresql://HOST/BANCO?sslmode=require  (usuário e senha separados)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cti}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Neon grátis tem poucas conexões e "dorme" quando parado
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Cria as tabelas ao subir (schema.sql só tem CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---- JWT ----
app.jwt.segredo=${JWT_SEGREDO:troque-este-segredo-com-32-caracteres-ou-mais}
app.jwt.validade-horas=${JWT_VALIDADE_HORAS:8}

# ---- CORS (endereços do front, separados por vírgula) ----
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# ---- Admin criado na primeira subida ----
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@cti.local}
app.admin.senha=${ADMIN_SENHA:Admin@12345}

# ---- Python ----
app.python.url=${PYTHON_URL:http://localhost:8000}
app.python.chave=${PYTHON_CHAVE:}
app.upload.max-linhas=5000
